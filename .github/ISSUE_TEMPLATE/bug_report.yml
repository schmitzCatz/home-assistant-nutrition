name: Bug report
description: Report a reproducible problem with the package, sensors, or dashboard.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting an issue. Please remove personal health data and tokens from logs/screenshots."
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options: [Weight, Energy, Macros, Dashboard, Installation, CI, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version or commit
      placeholder: "v1.2 or commit SHA"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.x"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or YAML (redacted)
      render: shell
