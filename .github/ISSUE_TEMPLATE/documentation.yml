name: Documentation improvement
description: Report missing, unclear, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Affected document or URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What needs improvement?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested wording or change
