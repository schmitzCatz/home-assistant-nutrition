name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install yamllint==1.37.1
      - name: Lint project YAML
        run: yamllint -c .yamllint.yml packages dashboards tests/ha-config .github/workflows
  home-assistant-config:
    name: Home Assistant configuration check
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/home-assistant/home-assistant:2026.9.4

    steps:
      - uses: actions/checkout@v4

      - name: Prepare configuration
        run: |
          mkdir -p /tmp/ha-config/packages
          cp tests/ha-config/configuration.yaml /tmp/ha-config/
          cp -a packages/. /tmp/ha-config/packages/

      - name: Validate configuration
        run: |
          python -m homeassistant \
            --script check_config \
            --config /tmp/ha-config
  calculation-tests:
    name: Nutrition calculation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test Home Assistant templates
        run: python -m pytest -q tests/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - yaml-lint
      - home-assistant-config
      - calculation-tests

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi

      - name: Create ZIP archive
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cd packages

          zip -r \
            "../dist/home-assistant-nutrition-${TAG}.zip" \
            . \
            -x "*.DS_Store" "__MACOSX/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$TAG" \
            "dist/home-assistant-nutrition-${TAG}.zip" \
            --verify-tag \
            --title "Home Assistant Nutrition $TAG" \
            --generate-notes \
            --latest
