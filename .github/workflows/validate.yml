name: Validate Home Assistant Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: python -m pip install yamllint==1.37.1
      - name: Lint project YAML
        run: yamllint -c .yamllint.yml packages dashboards tests/ha-config .github/workflows

  home-assistant-config:
    name: Home Assistant configuration check
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/home-assistant/home-assistant:2026.9.4

    steps:
      - uses: actions/checkout@v4

      - name: Prepare configuration
        run: |
          mkdir -p /tmp/ha-config/packages
          cp tests/ha-config/configuration.yaml /tmp/ha-config/
          cp packages/nutrition.yaml /tmp/ha-config/packages/

      - name: Validate configuration
        run: |
          python -m homeassistant \
            --script check_config \
            --config /tmp/ha-config
