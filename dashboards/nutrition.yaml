views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Targets
            heading_style: title
          - type: entities
            entities:
              - sensor.nutrition_weight
              - sensor.weight_goal_statistic
              - sensor.weight_lost
              - sensor.weight_remaining
              - sensor.weight_goal_progress
              - sensor.estimated_days_to_weight_goal
              - sensor.estimated_weight_goal_date
      - type: grid
        cards:
          - type: heading
            heading: Energy and Nutrition
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.nutrition_energy_expenditure
                name: Energy Expenditure
              - entity: sensor.target_calorie_deficit
              - entity: sensor.nutrition_calorie_target
                name: Calorie Target
              - entity: sensor.daily_calorie_target
              - entity: sensor.nutrition_bmr
                name: Basal Metabolic Rate
              - entity: sensor.active_energy_expenditure
              - entity: sensor.nutrition_protein_target
                name: Protein Target
              - entity: sensor.nutrition_fat_target
                name: Fat Target
              - entity: sensor.nutrition_carbohydrate_target
                name: Carbohydrate Target
              - entity: binary_sensor.nutrition_macro_budget_feasible
                name: Macro Budget Feasible
      - type: grid
        cards:
          - type: heading
            heading: History (7 Days)
            heading_style: title
          - type: history-graph
            entities:
              - entity: sensor.nutrition_weight
                name: Weight
            logarithmic_scale: false
            expand_legend: false
    max_columns: 4
    title: Overview
    cards: []
  - type: sections
    max_columns: 4
    title: Configuration
    path: configuration
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Datasources
            heading_style: title
          - type: entities
            entities:
              - entity: input_boolean.nutrition_manual_weight
                name: Use Manual Weight
              - entity: input_number.nutrition_manual_weight_kg
                name: Manual Weight
              - entity: input_boolean.nutrition_manual_energy
                name: Use Manual Daily Energy Budget
              - entity: input_number.nutrition_manual_daily_energy
                name: Manuel Daily Energy Budget
              - entity: input_boolean.nutrition_manual_bmr
                name: Use Manuel BMR
              - entity: input_number.nutrition_manual_bmr_kcal
                name: Use Manuel BMR
              - entity: input_text.nutrition_bmr_source
              - entity: input_text.nutrition_weight_source
              - entity: input_text.nutrition_energy_source
      - type: grid
        cards:
          - type: heading
            heading: Targets & Settings
            heading_style: title
          - type: entities
            entities:
              - entity: input_number.weight_start
              - entity: input_number.weight_goal
              - entity: input_number.target_calorie_deficit
              - entity: input_number.nutrition_reference_weight
                name: Macro Reference Weight
              - entity: input_number.nutrition_protein_factor
                name: Protein Factor
              - entity: input_number.nutrition_fat_factor
                name: Fat Factor
                