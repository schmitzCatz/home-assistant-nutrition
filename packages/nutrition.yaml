input_text:
  nutrition_bmr_source:
    name: Nutrition BMR Source Entity
    initial: sensor.garmin_connect_bmr_calories
    max: 255
    icon: mdi:link-variant
  nutrition_weight_source:
    name: Nutrition Weight Source Entity
    initial: sensor.garmin_connect_weight
    max: 255
    icon: mdi:link-variant
  nutrition_energy_source:
    name: Nutrition Daily Energy Source Entity
    initial: sensor.garmin_connect_burned_calories
    max: 255
    icon: mdi:link-variant

input_boolean:
  nutrition_manual_bmr:
    name: Nutrition Use Manual BMR
    initial: false
    icon: mdi:fire
  nutrition_manual_weight:
    name: Nutrition Use Manual Weight
    icon: mdi:scale-bathroom
  nutrition_manual_energy:
    name: Nutrition Use Manual Daily Energy
    initial: true
    icon: mdi:fire

input_number:
  nutrition_manual_bmr_kcal:
    name: Nutrition Manual BMR
    min: 500
    max: 4000
    step: 10
    unit_of_measurement: kcal
    mode: box
  nutrition_manual_weight_kg:
    name: Nutrition Manual Weight
    min: 20
    max: 350
    step: 0.1
    unit_of_measurement: kg
    mode: box
  nutrition_manual_daily_energy:
    name: Nutrition Manual Daily Energy Budget
    min: 1000
    max: 6000
    step: 50
    unit_of_measurement: kcal
    mode: box
  weight_start:
    name: Weight Start
    min: 20
    max: 350
    step: 0.1
    unit_of_measurement: kg
    mode: box
  weight_goal:
    name: Weight Goal
    min: 20
    max: 350
    step: 0.1
    unit_of_measurement: kg
    mode: box
  target_calorie_deficit:
    name: Target Calorie Deficit
    min: 0
    max: 30
    step: 1
    unit_of_measurement: '%'
    mode: box
  nutrition_protein_factor:
    name: Nutrition Protein Factor
    min: 0.8
    max: 2.5
    step: 0.1
    unit_of_measurement: g/kg
    mode: box
  nutrition_fat_factor:
    name: Nutrition Fat Factor
    min: 0.4
    max: 1.5
    step: 0.1
    unit_of_measurement: g/kg
    mode: box
  nutrition_reference_weight:
    name: Nutrition Macro Reference Weight
    min: 20
    max: 350
    step: 0.1
    unit_of_measurement: kg
    mode: box

template:
  - sensor:
      - name: Nutrition Weight
        unique_id: ha_nutrition_weight
        default_entity_id: sensor.nutrition_weight
        icon: mdi:scale-bathroom
        device_class: weight
        state_class: measurement
        unit_of_measurement: kg
        availability: >-
          {% set manual = is_state('input_boolean.nutrition_manual_weight', 'on') %}
          {% set src = states('input_text.nutrition_weight_source') %}
          {% set raw = states('input_number.nutrition_manual_weight_kg') if manual else states(src) %}
          {{ (manual or src.startswith('sensor.')) and is_number(raw) and (raw | float(0)) > 0 }}
        state: >-
          {% set src = states('input_text.nutrition_weight_source') %}
          {% set raw = states('input_number.nutrition_manual_weight_kg') if is_state('input_boolean.nutrition_manual_weight', 'on') else states(src) %}
          {{ raw | float | round(1) }}

      - name: Nutrition Energy Expenditure
        unique_id: ha_nutrition_energy_expenditure
        default_entity_id: sensor.nutrition_energy_expenditure
        icon: mdi:fire
        state_class: measurement
        unit_of_measurement: kcal
        availability: >-
          {% set manual = is_state('input_boolean.nutrition_manual_energy', 'on') %}
          {% set src = states('input_text.nutrition_energy_source') %}
          {% set raw = states('input_number.nutrition_manual_daily_energy') if manual else states(src) %}
          {{ (manual or src.startswith('sensor.')) and is_number(raw) and (raw | float(0)) > 0 }}
        state: >-
          {% set src = states('input_text.nutrition_energy_source') %}
          {% set raw = states('input_number.nutrition_manual_daily_energy') if is_state('input_boolean.nutrition_manual_energy', 'on') else states(src) %}
          {{ raw | float | round(0) }}

      - name: Nutrition BMR
        unique_id: ha_nutrition_bmr
        default_entity_id: sensor.nutrition_bmr
        icon: mdi:fire
        unit_of_measurement: kcal
        state_class: measurement
        availability: >-
          {% set manual = is_state('input_boolean.nutrition_manual_bmr', 'on') %}
          {% set src = states('input_text.nutrition_bmr_source') %}
          {% set raw = states('input_number.nutrition_manual_bmr_kcal') if manual else states(src) %}
          {{ (manual or src.startswith('sensor.')) and is_number(raw) and (raw | float(0)) > 0 }}
        state: >-
          {% set src = states('input_text.nutrition_bmr_source') %}
          {% set raw = states('input_number.nutrition_manual_bmr_kcal') if is_state('input_boolean.nutrition_manual_bmr', 'on') else states(src) %}
          {{ raw | float | round(0) }}

      - name: Active Energy Expenditure
        unique_id: ha_nutrition_active_energy_expenditure
        default_entity_id: sensor.active_energy_expenditure
        icon: mdi:run
        unit_of_measurement: kcal
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_energy_expenditure'))
             and is_number(states('sensor.nutrition_bmr'))
             and (states('sensor.nutrition_energy_expenditure') | float(0)) > 0
             and (states('sensor.nutrition_bmr') | float(0)) > 0 }}
        state: >-
          {{ (states('sensor.nutrition_energy_expenditure') | float(0)
              - states('sensor.nutrition_bmr') | float(0)) | round(0) }}

      - name: Daily Calorie Target
        unique_id: ha_nutrition_daily_calorie_target
        default_entity_id: sensor.daily_calorie_target
        icon: mdi:food-apple
        unit_of_measurement: kcal
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_calorie_target')) }}
        state: >-
          {{ states('sensor.nutrition_calorie_target') | float | round(0) }}

      - name: Estimated Days to Weight Goal
        unique_id: ha_nutrition_estimated_days_to_weight_goal
        default_entity_id: sensor.estimated_days_to_weight_goal
        icon: mdi:calendar-clock
        unit_of_measurement: d
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_weight'))
             and is_number(states('input_number.weight_goal'))
             and is_number(states('sensor.target_calorie_deficit'))
             and (states('sensor.nutrition_weight') | float(0)) > 0
             and (states('input_number.weight_goal') | float(0)) > 0
             and ((states('sensor.nutrition_weight') | float(0)) <= (states('input_number.weight_goal') | float(0))
                  or (states('sensor.target_calorie_deficit') | float(0)) > 0) }}
        state: >-
          {% set current = states('sensor.nutrition_weight') | float %}
          {% set goal = states('input_number.weight_goal') | float %}
          {% set deficit = states('sensor.target_calorie_deficit') | float %}
          {% if current <= goal %}
            0
          {% else %}
            {{ ((current - goal) * 7700 / deficit) | round(0) | int }}
          {% endif %}

      - name: Estimated Weight Goal Date
        unique_id: ha_nutrition_estimated_weight_goal_date
        default_entity_id: sensor.estimated_weight_goal_date
        icon: mdi:calendar-check
        device_class: date
        availability: >-
          {{ is_number(states('sensor.estimated_days_to_weight_goal')) }}
        state: >-
          {{ (today_at() + timedelta(days=states('sensor.estimated_days_to_weight_goal') | int(0))).date().isoformat() }}

      # Compatibility: replace the original UI template sensors with these IDs.
      # Existing UI template sensors must be deleted before enabling this package.
      - name: Weight Goal Statistic
        unique_id: ha_nutrition_weight_goal_statistic
        default_entity_id: sensor.weight_goal_statistic
        icon: mdi:flag-checkered
        unit_of_measurement: kg
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.weight_goal')) }}
        state: >-
          {{ states('input_number.weight_goal') | float | round(1) }}

      - name: Weight Lost
        unique_id: ha_nutrition_legacy_weight_lost
        default_entity_id: sensor.weight_lost
        icon: mdi:scale-bathroom
        unit_of_measurement: kg
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.weight_start')) and is_number(states('sensor.nutrition_weight')) }}
        state: >-
          {{ (states('input_number.weight_start') | float - states('sensor.nutrition_weight') | float) | round(1) }}

      - name: Weight Remaining
        unique_id: ha_nutrition_legacy_weight_remaining
        default_entity_id: sensor.weight_remaining
        icon: mdi:scale-bathroom
        unit_of_measurement: kg
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.weight_start')) and is_number(states('input_number.weight_goal')) and is_number(states('sensor.nutrition_weight')) }}
        state: >-
          {% set start = states('input_number.weight_start') | float %}
          {% set goal = states('input_number.weight_goal') | float %}
          {% set current = states('sensor.nutrition_weight') | float %}
          {{ ([((current - goal) if start > goal else (goal - current)), 0] | max) | round(1) }}

      - name: Weight Goal Progress
        unique_id: ha_nutrition_legacy_weight_goal_progress
        default_entity_id: sensor.weight_goal_progress
        icon: mdi:progress-check
        unit_of_measurement: '%'
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.weight_start')) and is_number(states('input_number.weight_goal')) and is_number(states('sensor.nutrition_weight')) and (states('input_number.weight_start') | float) != (states('input_number.weight_goal') | float) }}
        state: >-
          {% set start = states('input_number.weight_start') | float %}
          {% set goal = states('input_number.weight_goal') | float %}
          {% set current = states('sensor.nutrition_weight') | float %}
          {{ ([[((current - start) / (goal - start) * 100), 0] | max, 100] | min) | round(1) }}

      - name: Target Calorie Deficit
        unique_id: ha_nutrition_legacy_target_calorie_deficit
        default_entity_id: sensor.target_calorie_deficit
        icon: mdi:fire
        unit_of_measurement: kcal
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_energy_expenditure')) and is_number(states('input_number.target_calorie_deficit')) }}
        state: >-
          {{ (states('sensor.nutrition_energy_expenditure') | float * states('input_number.target_calorie_deficit') | float / 100) | round(0) }}

      - name: Nutrition Calorie Target
        unique_id: ha_nutrition_calorie_target
        default_entity_id: sensor.nutrition_calorie_target
        unit_of_measurement: kcal
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_energy_expenditure')) and is_number(states('sensor.target_calorie_deficit')) }}
        state: >-
          {{ (states('sensor.nutrition_energy_expenditure') | float - states('sensor.target_calorie_deficit') | float) | round(0) }}

      - name: Nutrition Protein Target
        unique_id: ha_nutrition_protein_target
        default_entity_id: sensor.nutrition_protein_target
        unit_of_measurement: g
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.nutrition_reference_weight')) and is_number(states('input_number.nutrition_protein_factor')) }}
        state: >-
          {{ (states('input_number.nutrition_reference_weight') | float * states('input_number.nutrition_protein_factor') | float) | round(0) }}

      - name: Nutrition Fat Target
        unique_id: ha_nutrition_fat_target
        default_entity_id: sensor.nutrition_fat_target
        unit_of_measurement: g
        state_class: measurement
        availability: >-
          {{ is_number(states('input_number.nutrition_reference_weight')) and is_number(states('input_number.nutrition_fat_factor')) }}
        state: >-
          {{ (states('input_number.nutrition_reference_weight') | float * states('input_number.nutrition_fat_factor') | float) | round(0) }}

      - name: Nutrition Carbohydrate Target
        unique_id: ha_nutrition_carbohydrate_target
        default_entity_id: sensor.nutrition_carbohydrate_target
        unit_of_measurement: g
        state_class: measurement
        availability: >-
          {{ is_number(states('sensor.nutrition_calorie_target')) and is_number(states('sensor.nutrition_protein_target')) and is_number(states('sensor.nutrition_fat_target')) }}
        state: >-
          {% set remaining = states('sensor.nutrition_calorie_target') | float - states('sensor.nutrition_protein_target') | float * 4 - states('sensor.nutrition_fat_target') | float * 9 %}
          {{ ([remaining / 4, 0] | max) | round(0) }}

  - binary_sensor:
      - name: Nutrition Macro Budget Feasible
        unique_id: ha_nutrition_macro_budget_feasible
        default_entity_id: binary_sensor.nutrition_macro_budget_feasible
        icon: mdi:check-circle-outline
        availability: >-
          {{ is_number(states('sensor.nutrition_calorie_target')) and is_number(states('sensor.nutrition_protein_target')) and is_number(states('sensor.nutrition_fat_target')) }}
        state: >-
          {{ states('sensor.nutrition_calorie_target') | float >= (states('sensor.nutrition_protein_target') | float * 4 + states('sensor.nutrition_fat_target') | float * 9) }}
