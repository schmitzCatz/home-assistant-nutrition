    sections:
      - type: grid
        cards:
          - type: heading
            heading_style: subtitle
            heading: Action
            icon: mdi:gesture-tap
        column_span: 4
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: System Health
          - type: gauge
            entity: sensor.system_ha_global_health_score
            name: HAGHS
            unit: " "
            needle: true
            severity:
              green: 90
              yellow: 75
              red: 0
          - type: markdown
            title: Score Breakdown
            content: >
              {% set e = 'sensor.system_ha_global_health_score' %}  {% set hw =
              state_attr(e, 'hardware_score') | int(0) %} {% set app =
              state_attr(e,'application_score') | int(0) %} {% set score =
              states(e) | int(0) %} | Hardware | Application | | **{{ hw
              }}**/100 | **{{ app }}**/100 |

              Formula: ({{ hw }} × 0.4) + ({{ app }} × 0.6) = {{ score }}
          - type: markdown
            title: 🛡️ Advisor
            content: >
              {% set e = 'sensor.system_ha_global_health_score' %} {% set rec =
              state_attr(e, 'recommendations') | default('', true) %} {% if
              states(e) in ['unavailable', 'unknown'] %}
                ⚠️ Health Advisor sensor is offline.
              {% elif rec not in [none, 'unknown', 'unavailable'] and '✅' not in
              rec %}
                {{ rec }}
              {% else %}
                ✅ System healthy. No recommendations.
              {% endif %}
          - type: markdown
            title: 📦 Updates & Maintenance
            content: >
              {% set e = 'sensor.system_ha_global_health_score' %} {% set
              updates = state_attr(e, 'pending_updates') | default([], true) |
              list %} {% set db_mb = state_attr(e, 'db_size_mb') | float(0) %}
              {% set keep = state_attr(e, 'recorder_keep_days') %} {% set filter
              = state_attr(e,'recorder_filter_active') | default(false, true) %}
              {% set psi = state_attr(e, 'psi_available') | default(false, true)
              %} {% set _upd = '/config/updates' %} {% if updates | length > 0
              %} {{ updates | length }} update(s) pending:
                {% for u in updates %} &nbsp;&nbsp; • {{ u }} {% endfor %}
                [→ Open Updates]({{ _upd }}) 
              {% else %} 
                ✅ All updates installed
              {% endif %}

              ***

              Database: {{ db_mb | round(1) }} MB {% if db_mb == 0.0
              %}*(external DB detected)*{% endif %} Recorder: {% if keep not in
              [none, 'unknown'] %}purge active ({{ keep }} days){% else %}no
              purge configured — DB may grow indefinitely{% endif %}

              {{ 'Entity filter active' if filter else 'No entity filter' }}

              ***

              **Metric source**:  {% if psi %}
                🟢 PSI active (CPU + RAM + I/O + Disk) — hardware score uses 4 components
              {% else %}
                ⚙️ Classic sensors (CPU + RAM + Disk) — hardware score uses 3 components
              {% endif %}
          - type: markdown
            title: 🧟 Zombie Entities
            content: >
              {% set e = 'sensor.system_ha_global_health_score' %} {% set z_raw
              = state_attr(e, 'zombie_entities') | default([], true) %} {% set
              z_count = state_attr(e, 'zombie_count') | int(0) %}

              {% if z_count == 0 %}

              ✅ No zombie entities detected.

              {% else %}

              {% if z_raw is string %}
                {% set z_list = z_raw.split(',') | map('trim') | list %}
              {% else %}
                {% set z_list = z_raw | list %}
              {% endif %}

              {% set grouped = expand(z_list) | groupby('domain') %}

              **{{ z_count }} zombie(s)** across **{{ grouped | length }}
              domain(s)**

              {% if z_count > 20 %} *(showing first 20 — {{ z_count - 20 }} more
              hidden)* {% endif %}

              [→ Check Entities](/config/entities)

              ---

              {% for domain in grouped %}

              ### {{ domain[0] | title }} ({{ domain[1] | count }})

              {% for item in domain[1] %}
                - **{{ item.entity_id }}** Device: {{ device_attr(item.entity_id, 'name') | default('unknown device', true) }} `{{ item.state }}`
              {% endfor %}

              {% endfor %}

              {% endif %}
